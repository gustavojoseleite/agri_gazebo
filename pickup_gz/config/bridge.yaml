# `ros_gz_bridge`: quais tópicos do Gazebo passam para o ROS 2, e em que direção.
#
# A ponte não é automática: um tópico que não está listado aqui simplesmente não
# existe do lado ROS. Cada entrada custa uma serialização/desserialização por
# mensagem, então faça a ponte do que você consome e nada além.
#
# Os nomes de tipo diferem de propósito: gz.msgs.* de um lado, interfaces ROS do
# outro. Um descasamento falha na partida com `Failed to create a bridge`.
#
# {name} é substituído pelo agri_gz_bringup/launch/sim.launch.py pelo nome do
# modelo no Gazebo, a mesma string sob a qual os plugins põem seus tópicos. É um
# modelo e não um arquivo pronto porque esse nome é um argumento do `launch`:
# criar dois veículos significa dois conjuntos diferentes de tópicos gz, e um
# arquivo estático só poderia casar com um deles.
#
# `ros_topic_name` é relativo de propósito, para que o conjunto todo caia sob o
# namespace que o `launch` receber (nenhum, por padrão).

# Tempo de simulação. Tudo o mais que define `use_sim_time` depende de este
# chegar, por isso ele vem primeiro. É do nível do mundo, logo fora de /model/.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ── Sensores ─────────────────────────────────────────────────────────────────
#
# Tudo abaixo desta linha é descartado quando um veículo é criado com
# sensors:=false, que é como os seguidores de um comboio sobem: os tópicos gz
# não existem nessas máquinas, e uma entrada da ponte para um tópico que
# ninguém publica é um tópico ROS que existe e nunca carrega nada, o que é
# pior que nenhum tópico. O agri_gz_bringup/agri_gz_bringup/vehicles.py corta
# o arquivo aqui, então o marcador é estrutural: não o reescreva.

- ros_topic_name: "imu/data"
  gz_topic_name: "/model/{name}/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "gnss/fix"
  gz_topic_name: "/model/{name}/navsat"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

# ── Câmera ───────────────────────────────────────────────────────────────────
#
# Descartada também quando um veículo é criado com camera:=false (os seguidores
# de um comboio). O vehicles.py corta aqui também: é estrutural, não o reescreva.

# A câmera publica a imagem em um tópico próprio e a calibração em
# <pai desse tópico>/camera_info, e por isso o tópico da imagem termina em
# /image em vez de ser o nome da câmera.
- ros_topic_name: "camera_front/image_raw"
  gz_topic_name: "/model/{name}/camera_front/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "camera_front/camera_info"
  gz_topic_name: "/model/{name}/camera_front/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
